name: Compile PDF slides

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache LaTeX Environment
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >-
            texlive-latex-base texlive-xetex texlive-extra-utils
            texlive-fonts-recommended texlive-fonts-extra
            texlive-latex-extra biber fontconfig latex-cjk-all
            texlive-pstricks

      - name: Reconfigure tex-common
        run: |
          sudo dpkg --configure -a

      - name: Install Custom Fonts
        run: |
          set -e
          # 安装 Microsoft 字体 (包括 Arial)
          echo "ttf-mscorefonts-installer \
            msttcorefonts/accepted-mscorefonts-eula select true" \
            | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer

          # 复制字体文件到系统字体目录 (假设字体文件在仓库的 fonts/ 目录下)
          sudo mkdir -p /usr/share/fonts/opentype/custom-fonts
          cp fonts/*.ttf /usr/share/fonts/opentype/custom-fonts/

          # 更新字体缓存
          sudo fc-cache -f

      - name: Check Font List
        run: |
          fc-list | grep -iE 'lxgw|sarasa|arial|times'

      - name: Clean Auxiliary Files
        run: |
          rm -f slide.aux slide.bbl slide.bcf slide.blg slide.log \
            slide.nav slide.out slide.run.xml slide.snm \
            slide.synctex.gz slide.toc slide.vrb

      - name: Compile LaTeX document
        run: |
          set -e
          if [ ! -f "slide.tex" ]; then
            echo "Error: slide.tex not found."
            exit 1
          fi
          # 三遍 xelatex：第一遍生成 .bcf，biber 生成 .bbl，
          # 后两遍收敛目录和交叉引用
          xelatex -synctex=1 -interaction=nonstopmode slide.tex
          biber slide
          xelatex -synctex=1 -interaction=nonstopmode slide.tex
          xelatex -synctex=1 -interaction=nonstopmode slide.tex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: slide-pdf
          path: slide.pdf
          retention-days: 30

      - name: Commit PDF if changed
        run: |
          git config user.name github-actions
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git add slide.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged, skip commit."
          else
            git commit -m "Auto compile LaTeX by GitHub Actions \
              $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
